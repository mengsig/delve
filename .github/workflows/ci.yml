name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Linux checks
        run: ./scripts/ci.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
          - os: macos-latest
            script: package:mac
          - os: windows-latest
            script: package:win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests on this platform
        run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged Linux app
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          version="$(node -p "require('./package.json').version")"
          sudo chown root:root "release/$version/linux-unpacked/chrome-sandbox"
          sudo chmod 4755 "release/$version/linux-unpacked/chrome-sandbox"
          xvfb-run --auto-servernum -- npm run test:linux-package -- "release/$version/linux-unpacked/delve"
      - name: Verify macOS framework signature and launch
        if: matrix.os == 'macos-latest'
        run: node scripts/smoke-macos-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: delve-${{ matrix.os }}
          path: |
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.dmg
            release/*/*-setup.exe
          if-no-files-found: error
          retention-days: 7
