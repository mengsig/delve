appId: dev.delve.app
productName: Delve
copyright: Copyright © 2026 mengsig
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: node_modules/@jitl/quickjs-singlefile-browser-release-sync/LICENSE
    to: licenses/quickjs.txt
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  icon: icon.png
  target:
    - AppImage
    - deb
  category: Education
  maintainer: mengsig <https://github.com/mengsig>
  artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  icon: icon.png
  target:
    - dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
protocols:
  - name: Delve learning intent
    schemes:
      - delve
